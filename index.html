<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TI-84 Plus CE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" type="text/css" href="https://mn.testnav.com/client/public/stylesheets/tn.css"/>

    <style>
      * { touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000 !important; display: flex; justify-content: center; align-items: center; }
      #scaler { display: flex; justify-content: center; align-items: center; transform-origin: center center; transition: transform 0.3s ease-out; opacity: 0; }
      #calculatorDiv, .calculatorDiv, .ti-calculator { background: #000 !important; outline: none !important; }
    </style>

    <script src="https://mn.testnav.com/client/texasinstruments/js/ELG-min.js"></script>
    <script id="h84statej" type="application/json" data-url="https://mn.testnav.com/client/texasinstruments/bin/No_AppsCE.h84statej"></script>
    <script id="ti84faceplate" type="application/json" data-url="https://mn.testnav.com/client/texasinstruments/images/TI84CE_touch.svg"></script>
  </head>
  <body>
    <div id="scaler"><div id="calculatorDiv"></div></div>

    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }

      const calc_div = document.getElementById("calculatorDiv");
      const scaler = document.getElementById("scaler");

      XMLHttpRequest.prototype.open = new Proxy(XMLHttpRequest.prototype.open, {
        apply: function (target, thisArg, args) {
          if (typeof args[1] === "string") args[1] = args[1].replace(/#.*$/, "");
          Reflect.apply(target, thisArg, args);
        },
      });

function fitToScreen() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Adjust these to create your "Safe Zone"
  const topInset = 80;    // Pushes screen below Dynamic Island
  const bottomInset = 0;  // Keeps buttons above Home Bar
  const safeH = h - topInset - bottomInset;

  // Reset for measurement
  scaler.style.transition = 'none';
  scaler.style.transform = 'scale(1)';

  const rect = calc_div.getBoundingClientRect();

  if (rect.width > 0 && rect.height > 0) {
    // 1. Calculate the 'Fatness' (Width Scale)
    // We use a 1.02 multiplier to ensure it bleeds slightly off the sides
    const scaleX = (w / rect.width) * 1.02;

    // 2. Calculate the 'Shortness' (Height Scale)
    // This forces the calculator to fit between your Insets
    const scaleY = safeH / rect.height;

    scaler.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-in';

    // 3. APPLY NON-UNIFORM SCALE: scale(Width, Height)
    // This forces the calculator into your phone's aspect ratio
    scaler.style.transform = `scale(${scaleX}, ${scaleY})`;

    // 4. Position it
    // We use translateY to nudge it perfectly into the safe area
    const offset = (topInset - bottomInset) / 2;
    scaler.style.transform += ` translateY(${offset}px)`;

    scaler.style.opacity = '1';
  }
}

      window.ti84 = new TI84PCE({
        ROMLocation: document.getElementById("h84statej").getAttribute("data-url") + "#.h84statej", 
        FaceplateLocation: document.getElementById("ti84faceplate").getAttribute("data-url") + "#.svg"
      });

      const observer = new ResizeObserver(() => { requestAnimationFrame(fitToScreen); });
      observer.observe(calc_div);
      window.addEventListener('resize', fitToScreen);
    </script>
  </body>
</html>
