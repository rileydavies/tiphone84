<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TI-84 Plus CE</title>
    
    <!-- Mobile Viewport & Fullscreen Standalone App Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TI-84 CE" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Web App Manifest & App Icons -->
    <link rel="manifest" href="manifest.json?v=11.0" />
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png?v=11.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png?v=11.0" />

    <!-- TI-84 Emulator Engine & Stylesheets -->
    <link rel="stylesheet" type="text/css" href="assets/tn.css" />
    <link rel="stylesheet" type="text/css" href="assets/app.css?v=11.0" />

    <!-- Persistent RAM State Interceptor -->
    <script>
      (function() {
        const origOpen = XMLHttpRequest.prototype.open;
        const origSend = XMLHttpRequest.prototype.send;

        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
          this._reqUrl = url;
          return origOpen.call(this, method, url, ...rest);
        };

        XMLHttpRequest.prototype.send = function(...args) {
          if (this._reqUrl && typeof this._reqUrl === 'string' && this._reqUrl.indexOf('.h84statej') !== -1) {
            try {
              const saved = localStorage.getItem('ti84_saved_ram');
              if (saved && saved.length > 50000) {
                console.log('[TI-84] Booting with saved RAM state (' + (saved.length / 1024).toFixed(0) + ' KB)');
                Object.defineProperty(this, 'status', { value: 200, writable: true, configurable: true });
                Object.defineProperty(this, 'responseText', { value: saved, writable: true, configurable: true });
                Object.defineProperty(this, 'readyState', { value: 4, writable: true, configurable: true });
                setTimeout(() => {
                  if (typeof this.onload === 'function') this.onload();
                }, 0);
                return;
              }
            } catch (e) {
              console.warn('[TI-84] Could not read saved RAM from storage:', e);
            }
          }
          return origSend.apply(this, args);
        };
      })();
    </script>

    <script src="assets/ELG-min.js"></script>
  </head>
  <body>
    <!-- Pure Calculator Viewport -->
    <div id="scaler">
      <div id="calculatorDiv"></div>
    </div>

    <!-- App Logic with Version Busting -->
    <script src="assets/app.js?v=11.0"></script>
  </body>
</html>
